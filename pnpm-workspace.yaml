# pnpm settings.
#
# As of pnpm v10/v11 the `pnpm` field in `package.json` is no longer read.
# Workspace-wide settings such as dependency overrides and build-script
# allow-lists now live here instead.
# See https://pnpm.io/settings

overrides:
  react: $react
  react-dom: $react-dom
  eslint-config-prettier: $eslint-config-prettier

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - nx
  - sharp

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@swc/core': set this to true or false
  better-sqlite3: set this to true or false
  core-js: set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  mongodb-memory-server: set this to true or false
  nx: set this to true or false
  prisma: set this to true or false
  sharp: set this to true or false
